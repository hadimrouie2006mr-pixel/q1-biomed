<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Q1 Biomed">
<title>Mon Q1 Biomed</title>
<script>try{var t=(JSON.parse(localStorage.getItem("q1biomed.prefs"))||{}).theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Concept : un cahier de labo. Chaque matière a son étiquette de couleur (comme les lames
   au microscope) ; c'est la seule couleur forte. Le reste est calme : encre sur papier gris-bleu.
   Navigation : rail à gauche sur ordi, barre d'onglets en bas sur téléphone. */
:root {
  --paper: #f2f4f6; --sheet: #ffffff; --ink: #17202a; --soft: #5b6672; --faint: #8b95a1; --rule: #dde2e8;
  --focus: #2457c5; --ok: #1b7f4f; --warn: #b5650a; --bad: #c03a2b;
  --bio: #2f6fde; --chimie: #d4572a; --maths: #138a5e; --physique: #b8860b; --anat: #8a4cc2; --other: #6c7783;
  --bio-t: #e6efff; --chimie-t: #fdece5; --maths-t: #e3f4ec; --physique-t: #f8f0dc; --anat-t: #f1e8fb; --other-t: #eceff2;
  --f-body: "Atkinson Hyperlegible", system-ui, sans-serif;
  --f-head: "Bricolage Grotesque", "Atkinson Hyperlegible", system-ui, sans-serif;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #12161b; --sheet: #1a2027; --ink: #e8edf2; --soft: #a3adb8; --faint: #76818d; --rule: #2a323b;
  --focus: #7aa7ff; --ok: #5fcf96; --warn: #f0b04f; --bad: #ff7d6e;
  --bio: #78a6f5; --chimie: #f39066; --maths: #58cf9d; --physique: #e7c25c; --anat: #c49af2; --other: #9aa5b1;
  --bio-t: #1c2a44; --chimie-t: #3a2219; --maths-t: #16302a; --physique-t: #342b14; --anat-t: #2c2140; --other-t: #232a32;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #12161b; --sheet: #1a2027; --ink: #e8edf2; --soft: #a3adb8; --faint: #76818d; --rule: #2a323b;
  --focus: #7aa7ff; --ok: #5fcf96; --warn: #f0b04f; --bad: #ff7d6e;
  --bio: #78a6f5; --chimie: #f39066; --maths: #58cf9d; --physique: #e7c25c; --anat: #c49af2; --other: #9aa5b1;
  --bio-t: #1c2a44; --chimie-t: #3a2219; --maths-t: #16302a; --physique-t: #342b14; --anat-t: #2c2140; --other-t: #232a32;
  color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Verrou ---------- */
.lock { min-height: 100%; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 16px 24px; }
.lock form { width: min(100%, 23rem); display: flex; flex-direction: column; gap: 16px; }
.lock h1 { font-family: var(--f-head); font-size: 2.2rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; }
.lock .tags { display: flex; gap: 6px; }
.lock .tags span { width: 28px; height: 8px; border-radius: 2px; }
.lock p { color: var(--soft); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 700; font-size: .9rem; }
.field input { padding: 12px 14px; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--sheet); font-size: 1rem; }
.field input:focus { border-color: var(--focus); outline: none; }
.check { display: flex; gap: 10px; align-items: center; color: var(--soft); font-size: .92rem; }
.check input { width: 18px; height: 18px; accent-color: var(--focus); }
.primary { border: 0; border-radius: var(--r); background: var(--ink); color: var(--paper); padding: 13px 16px; font-weight: 700; cursor: pointer; }
.err { color: var(--bad); font-size: .92rem; min-height: 1.4em; }

/* ---------- Coquille ---------- */
.shell { min-height: 100%; display: grid; grid-template-columns: 15rem 1fr; }
.rail { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 28px 14px; border-right: 1px solid var(--rule); background: var(--paper); }
.brand { font-family: var(--f-head); font-weight: 700; font-size: 1.25rem; letter-spacing: -.01em; padding: 0 10px 18px; line-height: 1.1; }
.brand small { display: block; font-family: var(--f-body); font-weight: 400; font-size: .8rem; color: var(--soft); margin-top: 4px; }
.tab { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; text-decoration: none; color: var(--soft); font-weight: 700; border: 0; background: none; cursor: pointer; text-align: left; }
.tab svg { width: 20px; height: 20px; flex: none; }
.tab:hover { color: var(--ink); background: var(--sheet); }
.tab[aria-current="page"] { color: var(--ink); background: var(--sheet); box-shadow: inset 3px 0 0 var(--ink); }
.rail .spacer { flex: 1; }
.rail .meta { font-size: .78rem; color: var(--faint); padding: 0 12px 8px; }
.view { min-width: 0; padding: 32px max(16px, env(safe-area-inset-right)) 80px max(16px, env(safe-area-inset-left)); }
.page { max-width: 58rem; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font-family: var(--f-head); font-weight: 700; font-size: clamp(1.9rem, 4.2vw, 2.6rem); letter-spacing: -.02em; line-height: 1.05; text-wrap: balance; }
.page-head p { color: var(--soft); max-width: 42rem; }
.block { display: flex; flex-direction: column; gap: 12px; }
.block > h2 { font-family: var(--f-head); font-weight: 700; font-size: 1.2rem; letter-spacing: -.01em; display: flex; align-items: baseline; gap: 10px; }
.block > h2 .count { font-family: var(--f-body); font-weight: 400; font-size: .9rem; color: var(--faint); }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); }
.muted { color: var(--soft); }
.small { font-size: .88rem; }
.empty { padding: 18px; color: var(--soft); }

.bottom { display: none; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .rail { display: none; }
  .view { padding-top: calc(20px + env(safe-area-inset-top)); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  .bottom { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--sheet); border-top: 1px solid var(--rule);
    padding: 6px max(6px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px, env(safe-area-inset-left)); }
  .bottom .tab { flex-direction: column; gap: 3px; font-size: .72rem; padding: 7px 2px; justify-content: center; align-items: center; text-align: center; }
  .bottom .tab[aria-current="page"] { box-shadow: none; background: var(--paper); }
}

.themebtn { display: inline-flex; align-items: center; gap: 10px; }
.themefab { display: none; }
@media (max-width: 820px) {
  .themefab { display: inline-flex; position: fixed; z-index: 11; top: calc(12px + env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
    width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
  .themefab svg { width: 20px; height: 20px; }
  .page-head { padding-right: 52px; }
}
.lock .themefab { display: inline-flex; position: fixed; z-index: 11; top: calc(14px + env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); width: 42px; height: 42px; border-radius: 50%; align-items: center; justify-content: center; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.lock .themefab svg { width: 20px; height: 20px; }
/* ---------- Étiquette matière (l'élément signature) ---------- */
.label { display: inline-flex; align-items: center; gap: 0; border-radius: 4px; overflow: hidden; font-size: .78rem; font-weight: 700; line-height: 1; white-space: nowrap; background: var(--t, var(--other-t)); color: var(--c, var(--other)); }
.label::before { content: ""; width: 6px; align-self: stretch; background: var(--c, var(--other)); }
.label span { padding: 5px 8px 5px 7px; }
.m-bio { --c: var(--bio); --t: var(--bio-t); } .m-chimie { --c: var(--chimie); --t: var(--chimie-t); }
.m-maths { --c: var(--maths); --t: var(--maths-t); } .m-physique { --c: var(--physique); --t: var(--physique-t); }
.m-anat { --c: var(--anat); --t: var(--anat-t); } .m-other { --c: var(--other); --t: var(--other-t); }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700; white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.s-ok { color: var(--ok); } .s-bad { color: var(--bad); } .s-warn { color: var(--warn); } .s-muted { color: var(--faint); }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 8px; padding: 7px 12px; font-weight: 700; font-size: .88rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.solid { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- Aujourd'hui ---------- */
.todo { display: flex; flex-direction: column; }
.todo-item { display: grid; grid-template-columns: 5.2rem 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--rule); }
.todo-item:first-child { border-top: 0; }
.todo-item .when { font-weight: 700; line-height: 1.2; }
.todo-item .when small { display: block; font-weight: 400; color: var(--soft); font-size: .8rem; }
.todo-item .what { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.todo-item .what b { font-weight: 700; }
.todo-item.urgent .when { color: var(--bad); }
@media (max-width: 520px) { .todo-item { grid-template-columns: 4.4rem 1fr; } .todo-item .act { grid-column: 2; justify-self: start; } }

.timeline { position: relative; padding: 8px 0; }
.slot { display: grid; grid-template-columns: 5.2rem 1fr; gap: 14px; padding: 10px 16px; align-items: start; }
.slot .t { font-weight: 700; font-size: .92rem; line-height: 1.3; }
.slot .t small { display: block; color: var(--faint); font-weight: 400; }
.slot .d { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-left: 14px; border-left: 3px solid var(--c, var(--rule)); }
.slot .d .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.slot .loc { color: var(--soft); font-size: .88rem; overflow-wrap: anywhere; }
.slot.past { opacity: .45; }
.slot.prep .d b::after { content: " · à préparer"; color: var(--warn); font-weight: 700; font-size: .82rem; }
.nowline { display: grid; grid-template-columns: 5.2rem 1fr; gap: 14px; padding: 0 16px; align-items: center; color: var(--bad); font-weight: 700; font-size: .78rem; }
.nowline i { height: 2px; background: var(--bad); border-radius: 1px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 16px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 2px; }
.stat:first-child { border-left: 0; }
.stat .v { font-family: var(--f-head); font-weight: 700; font-size: 1.7rem; line-height: 1.1; }
.stat .v small { font-family: var(--f-body); font-weight: 400; font-size: .85rem; color: var(--soft); }
.stat .k { color: var(--soft); font-size: .84rem; }
@media (max-width: 520px) { .stats { grid-template-columns: 1fr 1fr; } .stat:nth-child(3) { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--rule); } }

/* ---------- Filtres ---------- */
.filters { display: flex; flex-direction: column; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--rule); background: var(--sheet); border-radius: 999px; padding: 7px 14px; font-weight: 700; font-size: .9rem; cursor: pointer; }
.chip .n { font-weight: 400; color: var(--faint); font-size: .82rem; }
.chip .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .7; }
.chip.small { padding: 5px 11px; font-size: .82rem; }
.search { width: 100%; padding: 11px 14px; border: 1.5px solid var(--rule); border-radius: var(--r); background: var(--sheet); }
.search:focus { border-color: var(--focus); outline: none; }

/* ---------- Semaine ---------- */
.days { display: grid; grid-template-columns: repeat(7, minmax(3.4rem, 1fr)); gap: 6px; overflow-x: auto; }
.daybtn { border: 1.5px solid var(--rule); background: var(--sheet); border-radius: var(--r); padding: 8px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.daybtn .dn { font-size: .75rem; color: var(--soft); font-weight: 700; text-transform: capitalize; }
.daybtn .dd { font-family: var(--f-head); font-weight: 700; font-size: 1.25rem; line-height: 1; }
.daybtn .dots { display: flex; gap: 3px; height: 6px; }
.daybtn .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.daybtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.daybtn.today .dn { color: var(--bad); }
.toggle { display: inline-flex; gap: 10px; align-items: center; font-weight: 700; font-size: .9rem; cursor: pointer; }
.toggle input { width: 18px; height: 18px; accent-color: var(--ink); }

/* ---------- Listes (quiz, pdf, cours) ---------- */
.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 14px 16px; border-top: 1px solid var(--rule); align-items: center; }
.item:first-child { border-top: 0; }
.item .top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.item .title { font-weight: 700; }
.item .sub { color: var(--soft); font-size: .88rem; }
.item .right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.grade { font-family: var(--f-head); font-weight: 700; font-size: 1.3rem; line-height: 1; }
.grade small { font-family: var(--f-body); font-weight: 400; font-size: .8rem; color: var(--soft); }
.bar { width: 6.5rem; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c, var(--ink)); border-radius: 3px; }
button.item { width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; cursor: pointer; font: inherit; }
button.item:hover { background: var(--paper); }
.item .open { color: var(--soft); font-weight: 700; font-size: .85rem; }

.group { display: flex; flex-direction: column; gap: 10px; }
.group-head { display: flex; align-items: center; gap: 10px; }
.group-head h3 { font-family: var(--f-head); font-weight: 700; font-size: 1.05rem; }
.group-head .n { color: var(--faint); font-size: .88rem; }
.courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 10px; }
.course { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; text-decoration: none; border-left: 4px solid var(--c, var(--rule)); }
.course:hover { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.course .code { font-size: .8rem; font-weight: 700; color: var(--c); }
.course .name { font-weight: 700; line-height: 1.3; }
.course .seen { color: var(--soft); font-size: .84rem; }

/* ---------- Lecteur PDF ---------- */
.reader { position: fixed; inset: 0; z-index: 30; background: var(--paper); display: flex; flex-direction: column; }
.reader-bar { display: flex; align-items: center; gap: 8px; background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left)); }
.reader-bar .name { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader-bar .info { color: var(--soft); font-size: .85rem; }
.pages { flex: 1; overflow: auto; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 16px max(12px, env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
.pg { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); max-width: 100%; }
.pg canvas { display: block; width: 100%; height: auto; }
.pages .msg { margin: auto; color: var(--soft); text-align: center; max-width: 26rem; }

@media (prefers-reduced-motion: no-preference) {
  .page { animation: rise .28s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>
</head>
<body>

<!-- Verrou -->
<div class="lock" id="lock">
  <button class="themefab" type="button" data-theme-toggle aria-label="Changer le thème"></button>
  <form id="login" autocomplete="on">
    <div class="tags" aria-hidden="true"><span style="background:var(--bio)"></span><span style="background:var(--chimie)"></span><span style="background:var(--maths)"></span><span style="background:var(--physique)"></span></div>
    <h1>Mon Q1 Biomed</h1>
    <p>Ton espace d'études privé. Entre ton mot de passe pour l'ouvrir.</p>
    <input type="text" name="username" value="hadi" autocomplete="username" hidden>
    <div class="field"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <label class="check"><input id="remember" type="checkbox" checked> Se souvenir sur cet appareil</label>
    <button class="primary" id="go" type="submit">Ouvrir</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<!-- App -->
<div class="shell" id="app" hidden>
  <nav class="rail" aria-label="Navigation">
    <div class="brand">Mon Q1 Biomed<small>BA1 sciences biomédicales · B6</small></div>
    <div id="railTabs"></div>
    <div class="spacer"></div>
    <div class="meta" id="maj"></div>
    <button class="tab themebtn" type="button" data-theme-toggle aria-label="Changer le thème"></button>
    <button class="tab" type="button" data-logout>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Verrouiller
    </button>
  </nav>
  <main class="view" id="view"></main>
  <button class="themefab" type="button" data-theme-toggle aria-label="Changer le thème"></button>
  <nav class="bottom" id="bottomTabs" aria-label="Navigation"></nav>
</div>

<!-- Lecteur -->
<div class="reader" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="rname">
  <div class="reader-bar">
    <button class="btn" id="rclose" type="button">Fermer</button>
    <span class="name" id="rname"></span>
    <span class="info num" id="rinfo"></span>
    <button class="btn" id="zout" type="button" aria-label="Dézoomer">−</button>
    <button class="btn" id="zin" type="button" aria-label="Zoomer">+</button>
  </div>
  <div class="pages" id="pages"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const KEYSTORE = 'q1biomed.key', PREFS = 'q1biomed.prefs';
let KEY = null, D = null;

/* ---------- Préférences locales ---------- */
const prefs = (() => { try { return JSON.parse(localStorage.getItem(PREFS)) || {}; } catch (_) { return {}; } })();
const savePrefs = () => { try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch (_) {} };

/* ---------- Crypto ---------- */
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deriveKey(pw, cfg) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);

}

function pageCours() {
  const now = nowL();
  const groups = [['Ce quadrimestre', (c) => String(c.quadri).startsWith('Q1')], ['Deuxième quadrimestre', (c) => c.quadri === 'Q2'], ['Soutien et remédiation', (c) => !String(c.quadri).startsWith('Q')]];
  return h('div', { class: 'page' },
    h('header', { class: 'page-head' }, h('h1', {}, 'Tes cours'), h('p', {}, 'Touche un cours pour l’ouvrir sur l’UV (Moodle).')),
    groups.map(([title, f]) => {
      const list = cours.filter(f).sort((a, b) => (ORDER.indexOf(a.matiere) + 1 || 99) - (ORDER.indexOf(b.matiere) + 1 || 99) || a.code.localeCompare(b.code));
      if (!list.length) return null;
      return h('section', { class: 'block' }, h('h2', {}, title, h('span', { class: 'count num' }, String(list.length))),
        h('div', { class: 'courses' }, list.map((c) => h('a', { class: 'sheet course ' + mcls(c.matiere), href: c.lien, target: '_blank', rel: 'noopener', style: `--c:var(--${MAT[c.matiere] || 'other'})` },
          h('span', { class: 'code' }, c.code), h('span', { class: 'name' }, c.nom), h('span', { class: 'seen' }, c.dernier_acces ? `Ouvert ${rel(c.dernier_acces, now)}` : 'Jamais ouvert')))));
    }));
}

/* ---------- Lecteur PDF ---------- */
let doc = null, zoom = 1, tok = 0, obs = null, cur = null, lastFocus = null;
async function openPdf(p) {
  cur = p; lastFocus = document.activeElement;
  $('#reader').hidden = false; document.body.style.overflow = 'hidden';
  $('#rname').textContent = p.titre; $('#rinfo').textContent = '';
  if (location.hash !== '#pdf-' + p.id) { try { history.pushState(null, '', '#pdf-' + p.id); } catch (_) {} }
  $('#rclose').focus();
  const pages = $('#pages'); pages.replaceChildren(h('p', { class: 'msg' }, 'Ouverture du PDF…'));
  if (!p.enc) { pages.replaceChildren(h('p', { class: 'msg' }, 'Ce PDF n’est pas encore en ligne. Il le sera après la prochaine mise à jour du site.')); return; }
  try {
    const buf = await decrypt(await fetchBuf(p.enc)); if (cur !== p) return;
    doc = await pdfjsLib.getDocument({ data: new Uint8Array(buf) }).promise;
    $('#rinfo').textContent = doc.numPages + ' p.'; zoom = 1; layout();
  } catch (_) { pages.replaceChildren(h('p', { class: 'msg' }, 'Impossible d’ouvrir ce PDF. Vérifie ta connexion, puis réessaie.')); }
}
async function layout() {
  const my = ++tok, wrap = $('#pages'); wrap.replaceChildren(); if (obs) obs.disconnect();
  const b = (await doc.getPage(1)).getViewport({ scale: 1 });
  const w = Math.min(Math.max(260, wrap.clientWidth - 24), b.width * 1.6) * zoom, hgt = w * b.height / b.width;
  obs = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting && !e.target.dataset.done) { e.target.dataset.done = 1; draw(+e.target.dataset.n, e.target, my, w); } }), { root: wrap, rootMargin: '900px 0px' });
  for (let i = 1; i <= doc.numPages; i++) { const d = h('div', { class: 'pg', 'data-n': i, style: `width:${w}px;height:${hgt}px` }); wrap.append(d); obs.observe(d); }
  wrap.scrollTop = 0;
}
async function draw(n, holder, my, w) {
  const page = await doc.getPage(n); if (my !== tok) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), base = page.getViewport({ scale: 1 }), vp = page.getViewport({ scale: (w / base.width) * dpr });
  const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  if (my !== tok) return; holder.style.height = 'auto'; holder.replaceChildren(c);
}
function closeReader(fromHash) {
  $('#reader').hidden = true; document.body.style.overflow = ''; cur = null; doc = null; tok++;
  if (!fromHash && location.hash.startsWith('#pdf-')) { try { history.back(); } catch (_) {} }
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#rclose').addEventListener('click', () => closeReader(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#reader').hidden) closeReader(false); });
$('#zin').addEventListener('click', () => { if (doc) { zoom = Math.min(zoom * 1.25, 3); layout(); } });
$('#zout').addEventListener('click', () => { if (doc) { zoom = Math.max(zoom / 1.25, .5); layout(); } });

/* ---------- Thème ---------- */
const THEMES = ['auto', 'light', 'dark'];
const TLABEL = { auto: 'Thème : auto', light: 'Thème : clair', dark: 'Thème : sombre' };
const TICON = {
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>',
  light: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  dark: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
};
function applyTheme() {
  const t = THEMES.includes(prefs.theme) ? prefs.theme : 'auto';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  const isDark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute('content', isDark ? '#12161b' : '#f2f4f6'));
  document.querySelectorAll('[data-theme-toggle]').forEach((b) => {
    const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '2'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('aria-hidden', 'true'); s.innerHTML = TICON[t];
    b.replaceChildren(s); if (!b.classList.contains('themefab')) b.append(TLABEL[t]);
    b.setAttribute('aria-label', TLABEL[t] + ' (toucher pour changer)'); b.title = TLABEL[t];
  });
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-theme-toggle]')) { const i = THEMES.indexOf(THEMES.includes(prefs.theme) ? prefs.theme : 'auto'); prefs.theme = THEMES[(i + 1) % 3]; savePrefs(); applyTheme(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

/* ---------- Démarrage ---------- */
function start() {
  prepare(); buildTabs();
  if (D.maj) $('#maj').textContent = 'Mis à jour le ' + new Date(D.maj).toLocaleString('fr-BE', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  $('#lock').hidden = true; $('#app').hidden = false; route();
}
tryStored().then((ok) => { if (ok) start(); else $('#pw').focus(); });
})();
